<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bit Soluções - Autenticação</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .btn-blue { background-color: #2563eb; color: #ffffff; border: none; }
        .btn-blue:hover { background-color: #1d4ed8; color: #ffffff; }
        .text-blue { color: #2563eb !important; }
        .border-blue { border-color: #2563eb !important; }
    </style>
</head>
<body class="min-vh-100 d-flex flex-column justify-content-center align-items-center bg-body-tertiary">

<div style="width: 100%; max-width: 420px;" class="px-3">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-blue display-6">
            <i class="bi bi-headset me-2"></i>bit Soluções
        </h1>
        <p class="text-body-secondary">Portal de Solicitações Internas</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Usuário ou senha incorretos!
    </div>

    <div th:if="${param.logout}" class="alert alert-info shadow-sm" role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>Sessão encerrada com sucesso.
    </div>

    <form th:action="@{/login}" method="post" class="card border-blue p-4 shadow-lg rounded-4 bg-body">
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" id="username" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="password" name="password" class="form-control" placeholder="Digite sua senha" required>
            </div>
        </div>

        <button type="submit" class="btn btn-blue w-100 py-2 fw-bold shadow">
            <i class="bi bi-box-arrow-in-right me-2"></i>Acessar Portal
        </button>
    </form>
</div>

</body>
</html>
