spring.application.name=portal

# Configuração do DataSource dinâmico usando variáveis de ambiente
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:db_portal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:usuario}
spring.datasource.password=${MYSQL_PASSWORD:usuario123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração JPA e Hibernate (Schema validado pelo Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true